{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>{% block title %}Vetri Consultancy Services{% endblock %}</title>

  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Chatbot CSS -->
  <link rel="stylesheet" href="{% static 'chatbot/chat.css' %}">

  <style>
    body {
      font-family: 'Poppins', sans-serif;
      background: linear-gradient(135deg, #eef2f7, #f8f9fc);
      min-height: 100vh;
    }
    main.container {
      background: #edf4ff;
      padding: 30px;
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.05);
      backdrop-filter: blur(6px);
    }
  </style>
</head>

<body>

  {% include 'includes/navbar.html' %}

  {% if messages %}
  <div class="container mt-3">
    {% for message in messages %}
      <div class="alert alert-{{ message.tags }} alert-dismissible fade show text-center shadow-sm" role="alert">
        {{ message }}
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
      </div>
    {% endfor %}
  </div>
  {% endif %}

  <main class="container my-4">
    {% block content %}{% endblock %}
  </main>

  <!-- Chatbot widget -->
  {% include "chatbot/chat_widget.html" %}

  <!-- Chatbot JS -->
  <script src="{% static 'chatbot/chat.js' %}?v=10"></script>

  <!-- User info -->
  <script>
    window.USER_LOGGED_IN = {{ request.user.is_authenticated|yesno:"true,false" }};
    window.USER_NAME = "{{ request.user.first_name|default:'Guest' }}";
  </script>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  
</body>
</html>
